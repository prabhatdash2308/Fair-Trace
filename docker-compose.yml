services:
  postgres:
    image: postgres:15-alpine
    container_name: reviewguard_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reviewguard}
      POSTGRES_USER: ${POSTGRES_USER:-reviewguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviewguard_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reviewguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reviewguard_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: reviewguard_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - reviewguard_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reviewguard_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reviewguard}:${POSTGRES_PASSWORD:-reviewguard_secret}@postgres:5432/${POSTGRES_DB:-reviewguard}
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app
    networks:
      - reviewguard_net
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:

networks:
  reviewguard_net:
    driver: bridge
