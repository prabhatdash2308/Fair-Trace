[pytest]
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
addopts = -v --tb=short --cov=. --cov-report=term-missing

# Coverage.py configuration — read by pytest-cov automatically.
# 'omit' replaces the invalid --cov-omit CLI flag that was previously in addopts.
[coverage:run]
omit =
    migrations/*
    tests/*
    seed.py
